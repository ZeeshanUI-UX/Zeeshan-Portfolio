name: Import live images
# One-time job: copies the images that exist only on the live Vercel site into this repo.
on:
  push:
    paths: ['.github/workflows/import-live-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images from the live site
        run: |
          mkdir -p site/assets/img
          for f in about.webp avatar.webp bravo.webp fargo.webp hero-cutout.avif hero.webp logo.svg nitro.webp strida-hero.webp strida.webp wireframe.webp hero-hd-1.avif hero-hd-2.avif hero-hd-3.avif; do
            curl -fsSL "https://zeeshan-munawar.vercel.app/assets/img/$f" -o "site/assets/img/$f"
            echo "$f $(sha1sum site/assets/img/$f | cut -c1-40) $(wc -c < site/assets/img/$f)"
          done
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/img
          git commit -m "Import live site images" || echo "nothing to commit"
          git push
